name: CI
on:
  push:
    branches: [main, phase-01-foundation, fix/p01-ci-bootstrap, phase-02-firebase-owner-auth, phase-03-local-first-database, phase-04-05-customers-appointments-workflow, phase-06-07-employees-inventory, phase-08-09-pos-reports, phase-10-11-device-sync-backup, phase-12-13-gemini-deployment, phase-14-owner-app-polish-demo-data, phase-17-owner-app-acceptance, phase-18-ai-companion-demo-shortcuts]
  pull_request:
    branches: [main, phase-17-owner-app-acceptance]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production build (including optimized PWA service worker)
        run: npm run build
      - name: Install Cloud Functions dependencies
        run: npm --prefix functions install --no-audit --no-fund
      - name: Build Cloud Functions
        run: npm --prefix functions run build
